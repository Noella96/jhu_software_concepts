[pytest]
testpaths = tests
pythonpath = . src/web src/worker src/db
addopts = -q --cov=src --cov-report=term-missing --cov-fail-under=100
filterwarnings =
    ignore::RuntimeWarning
markers =
    web: Flask route/page tests
    worker: RabbitMQ consumer tests
    publisher: RabbitMQ publisher tests
    db: database schema/inserts/selects
    integration: end-to-end multi-service flows
