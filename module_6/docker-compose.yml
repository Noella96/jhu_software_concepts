# ==============================================================================
# Module 6 - Multi-Service Docker Compose Configuration
# Johns Hopkins University - Software Concepts (EN.605.601)
# Services: web (Flask:8080), worker (Consumer), db (PostgreSQL:5432), rabbitmq (AMQP:5672, UI:15672)
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: gradcafe_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gradcafe_db
      POSTGRES_USER: gradcafe_user
      POSTGRES_PASSWORD: gradcafe_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradcafe_user -d gradcafe_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gradcafe_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping -q"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - default

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    image: noella96/module_6-web:v1
    container_name: gradcafe_web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gradcafe_user:gradcafe_secure_pass_2026@db:5432/gradcafe_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      PORT: 8080
      FLASK_ENV: production
      SECRET_KEY: gradcafe_super_secret_microservice_key_2026
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default

  worker:
    build:
      context: ./src/worker
      dockerfile: Dockerfile
    image: noella96/module_6-worker:v1
    container_name: gradcafe_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gradcafe_user:gradcafe_secure_pass_2026@db:5432/gradcafe_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
    volumes:
      - ./src/data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default

volumes:
  postgres_data:
    name: gradcafe_postgres_data

networks:
  default:
    name: gradcafe_microservice_net
