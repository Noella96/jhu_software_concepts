name: Module 4 Pytest & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Pytest Suite & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gradcafe_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r module_4/requirements.txt

      - name: Populate initial PostgreSQL dataset
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/gradcafe_db
          POSTGRES_DB: gradcafe_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          cd module_4
          python src/load_data.py

      - name: Run Pytest marked test suite
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/gradcafe_db
          POSTGRES_DB: gradcafe_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          cd module_4
          pytest -v -m "web or buttons or analysis or db or integration"

      - name: Verify 100% test coverage
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/gradcafe_db
          POSTGRES_DB: gradcafe_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          cd module_4
          pytest --cov=src --cov-report=term-missing --cov-fail-under=100
