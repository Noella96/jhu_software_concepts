# ==============================================================================
# Module 7 - EC2 Cloud Microservice Deployment Configuration
# Johns Hopkins University - Software Concepts (EN.605.601)
# Services: web (Flask:8080), worker (Consumer), db (PostgreSQL:5432), rabbitmq (AMQP:5672, UI:15672)
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: gradcafe_db_ec2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gradcafe_db}
      POSTGRES_USER: ${POSTGRES_USER:-gradcafe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gradcafe_secure_pass_2026}
    ports:
      # Bound locally on EC2 host to prevent public internet exposure
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_ec2:/var/lib/postgresql/data
      - ../../module_6/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gradcafe_user} -d ${POSTGRES_DB:-gradcafe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gradcafe_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gradcafe_rabbitmq_ec2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      # Management UI bound locally on EC2 for access via SSH tunneling
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping -q"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gradcafe_net

  web:
    build:
      context: ../../module_6/src/web
      dockerfile: Dockerfile
    image: noella96/module_6-web:v1
    container_name: gradcafe_web_ec2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gradcafe_user}:${POSTGRES_PASSWORD:-gradcafe_secure_pass_2026}@db:5432/${POSTGRES_DB:-gradcafe_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/%2f
      PORT: 8080
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-gradcafe_ec2_production_secret_key_2026}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gradcafe_net

  worker:
    build:
      context: ../../module_6/src/worker
      dockerfile: Dockerfile
    image: noella96/module_6-worker:v1
    container_name: gradcafe_worker_ec2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gradcafe_user}:${POSTGRES_PASSWORD:-gradcafe_secure_pass_2026}@db:5432/${POSTGRES_DB:-gradcafe_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/%2f
    volumes:
      - ../../module_6/src/data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gradcafe_net

volumes:
  postgres_data_ec2:
    driver: local

networks:
  gradcafe_net:
    driver: bridge
