[pytest]
testpaths = tests
pythonpath = .
addopts = -q --cov=s3_fetch --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=100
filterwarnings =
    ignore::RuntimeWarning
markers =
    pipeline: S3 to SageMaker boto3 pipeline tests
    ec2: EC2 deployment and docker-compose verification
    unit: isolated unit tests
